name: ROS2 Build CI

on:
  push:
    branches: [main, latest]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            python3-colcon-extensions \
            python3-rospkg \
            && rm -rf /var/lib/apt/lists/*

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ 2>&1 | tee build.log
          echo "---BUILD_EXIT---"
          echo $?

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Skill validation
        run: |
          find agents/skills -name "SKILL.md" | wc -l
          echo "SKILL files found"

  test:
    needs: build
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with tests
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args -DBUILD_TESTING=ON

      - name: Run tests
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
