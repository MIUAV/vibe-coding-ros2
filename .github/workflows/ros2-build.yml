name: ROS2 VibeCoding CI

on:
  push:
    branches: [latest, develop]
  pull_request:
    branches: [latest, develop]
  workflow_dispatch:

env:
  ROS_DISTRO: humble
  UBUNTU_VERSION: jammy

jobs:
  core-files:
    name: Core Files & Anti-Patterns Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify core files
        run: |
          set -e
          for f in AGENTS.md AGENTS_CONCISE.md ANTI_PATTERNS.md init-agent.sh; do
            [[ -f "$f" ]] && echo "✓ $f" || { echo "✗ $f MISSING"; exit 1; }
          done
      - name: Verify scripts executable
        run: |
          for f in scripts/check_ros2_package.sh scripts/generators/ros2-package-generator.sh scripts/validators/ros2-node-validator.sh; do
            [[ -x "$f" ]] && echo "✓ $f" || { echo "✗ $f not executable"; exit 1; }
          done
      - name: Skill count
        run: |
          TOTAL=$(find agents/skills -name 'SKILL.md' 2>/dev/null | wc -l)
          echo "Total skills: $TOTAL"
          [[ $TOTAL -ge 50 ]] && echo "✓" || { echo "✗ Too few"; exit 1; }
      - name: Anti-Patterns coverage
        run: |
          grep -q "make_shared\|SharedPtr" ANTI_PATTERNS.md && echo "✓ Smart pointer rules" || exit 1
          grep -qi "QoS" ANTI_PATTERNS.md && echo "✓ QoS rules" || exit 1
          grep -qi "Lifecycle" ANTI_PATTERNS.md && echo "✓ Lifecycle rules" || exit 1

  cmake-check:
    name: CMakeLists.txt Correctness
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate generator template
        run: |
          GEN="scripts/generators/ros2-package-generator.sh"
          grep -q "find_package(ament_cmake REQUIRED)" "$GEN" && echo "✓ ament_cmake" || exit 1
          grep -q "find_package(rclcpp REQUIRED)" "$GEN" && echo "✓ rclcpp" || exit 1
          grep -q "ament_target_dependencies" "$GEN" && echo "✓ target_deps" || exit 1
          grep -q "install(TARGETS" "$GEN" && echo "✓ install" || exit 1
          grep -q "ament_package()" "$GEN" && echo "✓ ament_package" || exit 1
          grep -q "CMAKE_CXX_STANDARD 17" "$GEN" && echo "✓ C++17" || exit 1

  package-xml-check:
    name: package.xml Dependency Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate package.xml generator
        run: |
          GEN="scripts/generators/ros2-package-generator.sh"
          grep -q 'format="3"' "$GEN" && echo "✓ Format 3" || exit 1
          grep -q "<depend>rclcpp</depend>" "$GEN" && echo "✓ rclcpp dep" || exit 1
          grep -q "<depend>ament_lint_auto</depend>" "$GEN" && echo "✓ ament_lint" || exit 1
          grep -q "<export>" "$GEN" && echo "✓ export block" || exit 1

  ros2-compile:
    name: ROS2 Humble Compile Test
    runs-on: ubuntu-22.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Docker colcon build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            osrf/ros:humble-ros-base-jammy \
            bash -c "
              set -e
              apt-get update -qq && apt-get install -y -qq python3-colcon-common-extensions git > /dev/null 2>&1
              mkdir -p /tmp/test_ws/src
              cd /tmp/test_ws
              bash /workspace/scripts/generators/ros2-package-generator.sh test_pkg cpp rclcpp,std_msgs
              cp -r test_pkg /tmp/test_ws/src/
              source /opt/ros/humble/setup.bash
              colcon build --packages-select test_pkg --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -5
              [[ -f install/test_pkg/lib/test_pkg/test_pkg_node ]] && echo '✓ Binary built' || exit 1
              bash /workspace/scripts/check_ros2_package.sh /tmp/test_ws/src/test_pkg
              echo '=== ALL TESTS PASSED ==='
            "

  package-coupling:
    name: Package Coupling Analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependency graph
        run: |
          echo "=== Skill Dependencies ==="
          for skill in agents/skills/*/*/SKILL.md; do
            [[ -f "$skill" ]] || continue
            PKG=$(echo "$skill" | cut -d/ -f3)
            DEPS=$(grep '<depend>' "$skill" 2>/dev/null | sed 's/<depend>//g;s/<\/depend>//g' | tr '\n' ',' || echo "")
            [[ -n "$DEPS" ]] && echo "  $PKG → $DEPS"
          done | sort -u | head -20

  shellcheck:
    name: Shell Script Quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y -qq shellcheck > /dev/null 2>&1
      - name: Run shellcheck
        run: |
          for f in scripts/*.sh scripts/**/*.sh; do
            [[ -f "$f" ]] || continue
            shellcheck --disable=SC1091,SC2086 "$f" 2>&1 | grep -v "^$" || echo "  ✓ $f"
          done

  python-lint:
    name: Python Syntax & YAML
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install linters
        run: pip install flake8 pyyaml -q
      - name: Python syntax
        run: |
          for f in scripts/*.py scripts/**/*.py; do
            [[ -f "$f" ]] || continue
            python3 -m py_compile "$f" && echo "  ✓ $f" || exit 1
          done
      - name: YAML validation
        run: |
          for f in $(find . -name '*.yaml' -not -path './.git/*' 2>/dev/null | head -10); do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null && echo "  ✓ $f" || echo "  ✗ $f"
          done

  skill-quality:
    name: Skill Quality Classification
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Classify skills
        run: |
          VERIFIED=0; DRAFT=0; CONCEPT=0; EMPTY=0; TOTAL=0
          for skill in agents/skills/*/*/SKILL.md; do
            [[ -f "$skill" ]] || continue
            ((TOTAL++))
            SIZE=$(stat -c%s "$skill" 2>/dev/null || echo 100)
            if [[ $SIZE -lt 100 ]]; then ((EMPTY++))
            elif [[ $(wc -w < "$skill") -lt 50 ]]; then ((CONCEPT++))
            elif grep -q "## 示例\|## 代码\|status.*verified" "$skill" 2>/dev/null; then ((VERIFIED++))
            else ((DRAFT++)); fi
          done
          echo "Total: $TOTAL | Verified: $VERIFIED | Draft: $DRAFT | Concept: $CONCEPT | Empty: $EMPTY"
          [[ $EMPTY -gt 5 ]] && find agents/skills -name 'SKILL.md' -size -100c | sed 's/^/  WARN: /'
