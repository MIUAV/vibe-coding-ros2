name: ROS2 CI

on:
  push:
    branches: [main, latest]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 矩阵：多 distro + 多 job ───────────────────────────────
  build:
    name: "Build (${{ matrix.distro }})"
    runs-on: ubuntu-22.04
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, iron, jazzy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache apt
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3-pip clang-format
          version: 1.0

      # ── 依赖安装 ────────────────────────────────────────
      - name: Install deps
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            python3-colcon-extensions \
            python3-rospkg \
            ament-lint-auto \
            ament-clang-format \
            ament-clang-tidy \
            && rm -rf /var/lib/apt/lists/*

      # ── 代码格式化检查 ──────────────────────────────────
      - name: clang-format check
        run: |
          find . -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \
            | xargs clang-format --Werror --dry-run 2>&1 \
            | tee format.log
          if [[ -s format.log ]] && grep -q "error" format.log; then
            echo "FORMAT ERRORS DETECTED"; exit 1
          fi
          echo "Format check passed"

      # ── ament_lint 检查 ─────────────────────────────────
      - name: ament_lint
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon lint --cmake --amentlint AUTO RUN \
            --cmake-args -DBUILD_TESTING=ON 2>&1 | tee lint.log || true
          grep -qi "error\|failed" lint.log && exit 1 || echo "Lint passed"

      # ── 脚本语法检查 ────────────────────────────────────
      - name: Script syntax check
        run: |
          find scripts -name "*.sh" -type f | while read f; do
            bash -n "$f" 2>&1 || { echo "SYNTAX ERROR: $f"; exit 1; }
          done
          echo "All scripts syntax OK"

      # ── SKILL.md 完整性检查 ──────────────────────────────
      - name: SKILL validation
        run: |
          bash scripts/validators/skill-frontmatter-validator.sh || true
          find agents/skills -name "SKILL.md" -type f | wc -l | tee skill_count.txt
          echo "SKILL files validated"

      # ── 编译 ────────────────────────────────────────────
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --executor sequential \
            2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$BUILD_EXIT" >> $GITHUB_ENV
          echo "---BUILD_EXIT---"
          echo "$BUILD_EXIT"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.distro }}
          path: build.log

      - name: Fail on build error
        run: |
          [[ "$BUILD_EXIT_CODE" == "0" ]] || { echo "Build failed"; exit 1; }

  # ── 测试 job ──────────────────────────────────────────────
  test:
    needs: build
    name: "Test (${{ matrix.distro }})"
    runs-on: ubuntu-22.04
    container: ros:${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, iron]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update && apt-get install -y \
            python3-pip \
            python3-colcon-extensions \
            python3-rospkg \
            && rm -rf /var/lib/apt/lists/*

      - name: Build with tests
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build \
            --cmake-args -DBUILD_TESTING=ON \
            --event-handlers console_direct+

      - name: Run tests
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test \
            --event-handlers console_direct+ \
            --result-file test-results/
          colcon test-result --verbose --all | tee test-result.log
          ! grep -qi "failed\|error" test-result.log || exit 1

      - name: Coverage (humble only)
        if: matrix.distro == 'humble'
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select ${{ matrix.pkg }} \
            --cmake-args -DCMAKE_BUILD_TYPE=Coverage \
            --event-handlers console_direct+ || true
        continue-on-error: true

      - name: Upload coverage
        if: matrix.distro == 'humble'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.distro }}
          path: test-results/

  # ── 示例包编译测试 ────────────────────────────────────────
  examples:
    name: "Examples build test"
    runs-on: ubuntu-22.04
    container: ros:humble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build examples
        run: |
          source /opt/ros/humble/setup.bash
          for pkg in examples/*/; do
            pkg_name=$(basename "$pkg")
            if [[ -f "$pkg/package.xml" ]]; then
              echo "Building $pkg_name..."
              colcon build --packages-select "$pkg_name" 2>&1 | tail -3
            fi
          done
          echo "All examples built OK"

  # ── 代码质量汇总 ─────────────────────────────────────────
  quality:
    name: "Code quality"
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count lines
        run: |
          echo "## Code Stats" >> $GITHUB_STEP_SUMMARY
          echo "- C++ files: \`$(find . -name "*.cpp" -o -name "*.hpp" | wc -l)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Python files: \`$(find . -name "*.py" | wc -l)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scripts: \`$(find scripts -name "*.sh" | wc -l)\`" >> $GITHUB_STEP_SUMMARY
          echo "- SKILL.md: \`$(find agents/skills -name "SKILL.md" | wc -l)\`" >> $GITHUB_STEP_SUMMARY

      - name: No large files check
        run: |
          large=$(find . -size +5M ! -path "./.git/*" ! -path "./node_modules/*" 2>/dev/null | head -5)
          [[ -z "$large" ]] && echo "No files > 5MB — OK" || { echo "Large files found: $large"; exit 1; }

      - name: Readme check
        run: |
          [[ -f README.md ]] && echo "README.md exists — OK" || { echo "Missing README.md"; exit 1; }
          [[ -s README.md ]] && echo "README.md not empty — OK" || { echo "README.md empty"; exit 1; }
